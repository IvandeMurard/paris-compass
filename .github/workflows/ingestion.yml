# Scheduled ingestion — w0-cron (#6) then w1-cadence (#70), PLAN.md §2.2bis and §2.2ter.
#
# The sources do not share a rhythm, and one cadence would be wrong for nearly all of them:
# BODACC publishes every working day, the Ville de Paris updates its worksites weekly, INSEE
# republishes SIRENE monthly, APUR surveys every three years with no announced calendar, and
# the reference layers barely move. Hence one `cron` entry per source rather than a common
# schedule — the time step is a property of the source, not of the pipeline.
#
# ── Four, then eight ──────────────────────────────────────────────────────────────────────
#
# #6 wrote four schedules on 25 August 2026, for the four sources that existed that day. The
# four that arrived in the days after — chantiers, sirene_stock, plu, terrasses — registered
# nowhere, and nothing said so for a week. That is the failure #70 exists to make impossible,
# and the four `cron` lines below are its smaller half: the rule that stops the ninth source
# from being born without a cadence is scripts/porte/cadences.ts, played by every `npm run
# test`. Adding a source here without a schedule now turns the gate red.
#
# The four later cadences are VERIFICATION cadences and nothing more. Reloading does not
# rejuvenate a Conseil de Paris vote nor a terrace authorisation: it checks that the layer
# still served is the one the source publishes, which is the same reading BDCom already had.
#
# This job carries the privileged connection, never the anon key. The loaders write to tables
# with no insert policy (scripts/ingest/lib/db.ts), so they need a role that bypasses RLS. The
# anon key is public — it ships in the browser bundle.
#
# Public repository, so the triggers are deliberately reduced to `schedule` and
# `workflow_dispatch`. Never `pull_request`, and above all never `pull_request_target`: the
# latter would run branch code from anywhere with access to the secrets.

name: Ingestion

on:
  schedule:
    # UTC. Offset from one another so that GitHub's scheduling lag — common, tens of minutes
    # on the hour — does not make two loads collide. The `concurrency` lock below is the real
    # guarantee; this only avoids queueing behind it every day.
    - cron: "17 3 * * *"      # BODACC — daily, the only source that ages in days
    # SIRENE géolocalisé — every Friday night, in the window decided by Ivan on 6 October 2026
    # (#239). INSEE republishes monthly; the load is weekly because its TRUNCATE locks readers
    # until commit, and that lock belongs in the night, not on whatever weekday the 3rd falls.
    # 21:43 UTC is 23:43 in Paris: GitHub's scheduling lag — more than seven hours, measured on
    # the BODACC runs 37297466279 (7 h 17, 5 October 2026) and 37449828184 (7 h 09, 6 October)
    # — still lands inside the night from there. Re-reading an unchanged month
    # is harmless — the loader is idempotent and TRUNCATE leaves no space behind.
    - cron: "43 21 * * 5"
    - cron: "11 5 5 1,4,7,10 *"  # BDCom — quarterly: we verify, we do not rejuvenate
    - cron: "37 6 7 1,7 *"    # Geography — twice a year, never next to BDCom
    # ── #70 ──────────────────────────────────────────────────────────────────────────────
    # Chantiers — weekly, the rhythm the dataset declares for itself. Tuesday rather than
    # Monday: the city's own update lands over the start of the week, and a load that runs
    # before it would spend a week presenting last week's worksites as current.
    - cron: "7 2 * * 2"
    # SIRENE stock — every Friday night, same window and same reason as SIRENE géolocalisé
    # above (#239), fifty minutes before it so the two never queue on the lock. INSEE
    # republishes the stock on the 1st and REPLACES the resource rather than archiving it,
    # which is what made a pinned URL 404 on 25 August 2026 (#56): the loader resolves the
    # vintage from the data.gouv.fr API rather than pinning it, so a weekly run picks up the
    # new month within a week of its publication.
    - cron: "53 20 * * 5"
    # PLU — twice a year, and this one is a verification. The Conseil de Paris votes without
    # an announced calendar, so there is no rhythm to follow; what this catches is the day the
    # published layer stops being the one loaded here, and `source_as_of` will not have moved.
    - cron: "21 5 9 3,9 *"
    # Terrasses — twice a year, framing the seasonal window rather than dividing the year
    # evenly. The "estivales" authorisations run 1 April to 31 October (the source's own
    # regulatory page): 8 April sees the window opened, 8 November sees it closed.
    - cron: "9 5 8 4,11 *"
    # ── w2-idfm (#19) ────────────────────────────────────────────────────────────────────
    # IDFM validations — the source's own banner: "mises à jour fin février et fin août".
    # 5 March and 5 September, a few days of margin after each month-end for the portal to
    # actually publish, the same discipline SIRENE stock's "one day of margin" applies.
    - cron: "33 6 5 3,9 *"
    # ── w2-filosofi (#18) ────────────────────────────────────────────────────────────────
    # Filosofi carroyé 200 m — a VERIFICATION cadence, like BDCom, PLU and terrasses: INSEE
    # announces no calendar for this dispositif (irregular in practice — 2015, 2017, then
    # 2019-and-2021 together, each generation years after the income year it describes).
    # Twice a year, offset from PLU and terrasses so no two verification loads collide.
    - cron: "45 5 6 3,9 *"
    # ── w4-meubles (#27) ─────────────────────────────────────────────────────────────────
    # Meublés touristiques (changement d'usage) — a DECLARED annual cadence, the catalogue's
    # own metas.dcat.accrualperiodicity read 8 September 2026: "Annuelle". Once a year, two
    # weeks after the file's own last-modified date at that reading (2026-06-05) — the same
    # margin SIRENE stock and IDFM give the portal to actually republish before verifying.
    - cron: "51 5 20 6 *"

  workflow_dispatch:
    inputs:
      source:
        description: "Jeu à recharger"
        required: true
        type: choice
        options: [bodacc, sirene, bdcom, geography, chantiers, sirene_stock, plu, terrasses, idfm, filosofi, meubles]

# One ingestion at a time, and the running one is never killed: an interrupted load leaves a
# rolled-back transaction, so nothing loaded, so a run lost rather than replaced. The loaders
# are idempotent, not concurrent.
concurrency:
  group: ingestion
  cancel-in-progress: false

# The job reads the repository and writes to Postgres. It opens one thing, and only on a
# failed scheduled load: the issue that says so — w1-porte-planifiee (#71), point 4. Until
# 31 August 2026 this file carried no `if: failure()` at all, so a load that fell over was
# silent: `run_by = 'schedule'` went on claiming the automation worked while `ingested_at`
# aged. A silent cadence is worse than an absent one — it removes the vigilance without
# supplying the guarantee.
permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # SIRENE reads several hundred megabytes of INSEE parquet through DuckDB before writing
    # anything — five minutes and more on a shared runner.
    timeout-minutes: 60

    steps:
      - name: Quelle source
        id: which
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.source }}
        run: |
          set -euo pipefail
          case "${SCHEDULE:-}" in
            "17 3 * * *")           source=bodacc ;;
            "43 21 * * 5")          source=sirene ;;
            "11 5 5 1,4,7,10 *")    source=bdcom ;;
            "37 6 7 1,7 *")         source=geography ;;
            "7 2 * * 2")            source=chantiers ;;
            "53 20 * * 5")          source=sirene_stock ;;
            "21 5 9 3,9 *")         source=plu ;;
            "9 5 8 4,11 *")         source=terrasses ;;
            "33 6 5 3,9 *")         source=idfm ;;
            "45 5 6 3,9 *")         source=filosofi ;;
            "51 5 20 6 *")          source=meubles ;;
            "")                     source="${CHOSEN:?ni schedule ni input : rien à faire}" ;;
            *)
              echo "::error::Planification inconnue « ${SCHEDULE} » — la table de correspondance de ce fichier est désynchronisée du bloc on.schedule."
              exit 1 ;;
          esac
          echo "source=${source}" >> "$GITHUB_OUTPUT"
          echo "Source retenue : ${source}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Charger ${{ steps.which.outputs.source }}
        env:
          # The only secret in this workflow. Never printed: the loaders go through
          # `connectionTarget()`, which returns the project ref and host without the password.
          # GitHub also masks the value in logs, but relying on masking rather than on code
          # that does not print it would be a bet.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          case "${{ steps.which.outputs.source }}" in
            bodacc)
              # Chained as a safety net. Until #239 bodacc.ts rebuilt bodacc_announcement
              # wholesale, which cascades to bodacc_establishment and took `operator_confirmed`
              # with it — measured 25 August: the evaluation gate fell from 3 147 `corrobore`
              # levels to zero, and nothing said so. Since #239 (6 October 2026) bodacc.ts
              # replaces a month at a time and confirms each month inside its own transaction, so
              # this step finds nothing to change on an ordinary night: it rewrites only the
              # verdicts that differ, and it reads sirene_establishment alone, no INSEE
              # download. It stays because it is what catches a confirmation left behind by
              # anything else. DIAGNOSTIC.md §17, issue #56, DIAGNOSTIC-CORRIGES.md §62.
              npx tsx scripts/ingest/bodacc.ts
              npx tsx scripts/ingest/sirene.ts --confirm-only ;;
            sirene)    npx tsx scripts/ingest/sirene.ts ;;
            geography) npx tsx scripts/ingest/geography.ts ;;
            bdcom)
              # Chained, and in this order. geography.ts attaches every premise to its
              # quartier and street segment: reloading the census without replaying the
              # attachment would leave new premises unattached, and so absent from the
              # per-quartier aggregates — a silent loss, the family of defects this project
              # hunts.
              npx tsx scripts/ingest/bdcom.ts
              npx tsx scripts/ingest/geography.ts ;;
            # The four of #70. None is chained: each rebuilds its own reference table and
            # recomputes its own attachment from scratch, so re-running one alone is safe —
            # the headers of chantiers.ts, plu.ts, terrasses.ts and sirene-stock.ts each say
            # so, and each needs geography.ts to have run once, which it has.
            chantiers)    npx tsx scripts/ingest/chantiers.ts ;;
            sirene_stock) npx tsx scripts/ingest/sirene-stock.ts ;;
            plu)          npx tsx scripts/ingest/plu.ts ;;
            terrasses)    npx tsx scripts/ingest/terrasses.ts ;;
            # w2-idfm (#19). Needs geography.ts to have run once for premise_location.geom,
            # which it has — same footing as the four above.
            idfm)         npx tsx scripts/ingest/idfm.ts ;;
            # w2-filosofi (#18). Same footing again: rebuilds its own reference table and
            # recomputes its own attachment from scratch, needs geography.ts and quartier to
            # already exist (restrictToQuartiers reads the latter), both of which they do.
            filosofi)     npx tsx scripts/ingest/filosofi.ts ;;
            # w4-meubles (#27). Rebuilds its own reference table from scratch — no premise
            # attachment at all (a density around a point, never a per-premise pointer; see the
            # migration header) — so it needs nothing else to have run first.
            meubles)      npx tsx scripts/ingest/meubles.ts ;;
          esac

      - name: Fraîcheur après chargement
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # `always()`: this reading matters most on failure, where it shows `last_success_at`
        # did **not** move — a failed run refreshes nothing, which is exactly what the table
        # has to guarantee.
        #
        # `--releve-seul` on purpose, and it is the only place that passes it. Since #70 the
        # script settles a verdict on the whole table, and a source OTHER than the one this job
        # just loaded being past its cadence would fail this job and open an issue titled
        # « chargement en échec » naming the wrong dataset. The verdict belongs to the gate,
        # which judges the state of the remote as a whole: .github/workflows/porte.yml plays
        # `freshness` as an arm of its own, every morning.
        run: npx tsx scripts/ingest/freshness.ts --releve-seul

      # ── L'échec se voit ─────────────────────────────────────────────────────────────────
      #
      # Same channel as the scheduled gate, deliberately: same three-block report, same label,
      # same one-open-issue-at-a-time rule. Three protocols producing three report formats is
      # three things to read, therefore zero things read — #71 and #73.
      #
      # Only on `schedule`. A load launched from the Actions tab has somebody watching it, and
      # the same distinction `recordRun` makes between a kept cadence and a button press.
      #
      # The body carries no loader log. The loaders print `connectionTarget()`, and this
      # repository is public: the run's own journal, which is not, is one click away.
      - name: Le chargement a échoué — le dire
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PORTE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .porte
          npm run porte:rapport -- \
            --echec-ingestion "${{ steps.which.outputs.source }}" \
            --sortie .porte/rapport.md
          npm run porte:signal -- \
            --corps .porte/rapport.md \
            --titre "Cron d'ingestion — chargement en échec" \
            --label porte-rouge

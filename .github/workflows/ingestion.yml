# Scheduled ingestion — w0-cron (#6), PLAN.md §2.2bis and §2.2ter.
#
# The four sources do not share a rhythm, and one cadence would be wrong for at least three of
# them: BODACC publishes every working day, INSEE republishes SIRENE monthly, APUR surveys every
# three years with no announced calendar, and the reference geography barely moves. Hence four
# `cron` entries in one file rather than a common schedule — the time step is a property of the
# source, not of the pipeline.
#
# This job carries the privileged connection, never the anon key. The loaders write to tables
# with no insert policy (scripts/ingest/lib/db.ts), so they need a role that bypasses RLS. The
# anon key is public — it ships in the browser bundle.
#
# Public repository, so the triggers are deliberately reduced to `schedule` and
# `workflow_dispatch`. Never `pull_request`, and above all never `pull_request_target`: the
# latter would run branch code from anywhere with access to the secrets.

name: Ingestion

on:
  schedule:
    # UTC. Offset from one another so that GitHub's scheduling lag — common, tens of minutes
    # on the hour — does not make two loads collide. The `concurrency` lock below is the real
    # guarantee; this only avoids queueing behind it every day.
    - cron: "17 3 * * *"      # BODACC — daily, the only source that ages in days
    - cron: "43 4 3 * *"      # SIRENE — monthly, on the 3rd, after INSEE republishes
    - cron: "11 5 5 1,4,7,10 *"  # BDCom — quarterly: we verify, we do not rejuvenate
    - cron: "37 6 7 1,7 *"    # Geography — twice a year, never next to BDCom

  workflow_dispatch:
    inputs:
      source:
        description: "Jeu à recharger"
        required: true
        type: choice
        options: [bodacc, sirene, bdcom, geography]

# One ingestion at a time, and the running one is never killed: an interrupted load leaves a
# rolled-back transaction, so nothing loaded, so a run lost rather than replaced. The loaders
# are idempotent, not concurrent.
concurrency:
  group: ingestion
  cancel-in-progress: false

# The job reads the repository and writes to Postgres. It opens one thing, and only on a
# failed scheduled load: the issue that says so — w1-porte-planifiee (#71), point 4. Until
# 31 August 2026 this file carried no `if: failure()` at all, so a load that fell over was
# silent: `run_by = 'schedule'` went on claiming the automation worked while `ingested_at`
# aged. A silent cadence is worse than an absent one — it removes the vigilance without
# supplying the guarantee.
permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # SIRENE reads several hundred megabytes of INSEE parquet through DuckDB before writing
    # anything — five minutes and more on a shared runner.
    timeout-minutes: 60

    steps:
      - name: Quelle source
        id: which
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.source }}
        run: |
          set -euo pipefail
          case "${SCHEDULE:-}" in
            "17 3 * * *")           source=bodacc ;;
            "43 4 3 * *")           source=sirene ;;
            "11 5 5 1,4,7,10 *")    source=bdcom ;;
            "37 6 7 1,7 *")         source=geography ;;
            "")                     source="${CHOSEN:?ni schedule ni input : rien à faire}" ;;
            *)
              echo "::error::Planification inconnue « ${SCHEDULE} » — la table de correspondance de ce fichier est désynchronisée du bloc on.schedule."
              exit 1 ;;
          esac
          echo "source=${source}" >> "$GITHUB_OUTPUT"
          echo "Source retenue : ${source}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Charger ${{ steps.which.outputs.source }}
        env:
          # The only secret in this workflow. Never printed: the loaders go through
          # `connectionTarget()`, which returns the project ref and host without the password.
          # GitHub also masks the value in logs, but relying on masking rather than on code
          # that does not print it would be a bet.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          case "${{ steps.which.outputs.source }}" in
            bodacc)
              # Chained, and this one is not optional. bodacc.ts rebuilds bodacc_announcement
              # wholesale, which cascades to bodacc_establishment and takes `operator_confirmed`
              # with it — every SIRENE confirmation, destroyed by a reload. Measured 25 August:
              # the evaluation gate fell from 3 147 `corrobore` levels to zero, 5.92 points of
              # the established+corroborated composition, and nothing said so.
              #
              # Without this line a daily BODACC cron would wipe the confirmations every night
              # while SIRENE only runs monthly. The confirmation step reads sirene_establishment
              # alone, which a BODACC reload does not touch, so it costs seconds and no INSEE
              # download. DIAGNOSTIC.md §17, issue #56.
              npx tsx scripts/ingest/bodacc.ts
              npx tsx scripts/ingest/sirene.ts --confirm-only ;;
            sirene)    npx tsx scripts/ingest/sirene.ts ;;
            geography) npx tsx scripts/ingest/geography.ts ;;
            bdcom)
              # Chained, and in this order. geography.ts attaches every premise to its
              # quartier and street segment: reloading the census without replaying the
              # attachment would leave new premises unattached, and so absent from the
              # per-quartier aggregates — a silent loss, the family of defects this project
              # hunts.
              npx tsx scripts/ingest/bdcom.ts
              npx tsx scripts/ingest/geography.ts ;;
          esac

      - name: Fraîcheur après chargement
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # `always()`: this reading matters most on failure, where it shows `last_success_at`
        # did **not** move — a failed run refreshes nothing, which is exactly what the table
        # has to guarantee.
        run: npx tsx scripts/ingest/freshness.ts

      # ── L'échec se voit ─────────────────────────────────────────────────────────────────
      #
      # Same channel as the scheduled gate, deliberately: same three-block report, same label,
      # same one-open-issue-at-a-time rule. Three protocols producing three report formats is
      # three things to read, therefore zero things read — #71 and #73.
      #
      # Only on `schedule`. A load launched from the Actions tab has somebody watching it, and
      # the same distinction `recordRun` makes between a kept cadence and a button press.
      #
      # The body carries no loader log. The loaders print `connectionTarget()`, and this
      # repository is public: the run's own journal, which is not, is one click away.
      - name: Le chargement a échoué — le dire
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PORTE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .porte
          npm run porte:rapport -- \
            --echec-ingestion "${{ steps.which.outputs.source }}" \
            --sortie .porte/rapport.md
          npm run porte:signal -- \
            --corps .porte/rapport.md \
            --titre "Cron d'ingestion — chargement en échec" \
            --label porte-rouge
